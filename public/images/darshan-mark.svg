<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="markGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="markFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
  </defs>
  
  <rect width="100" height="100" rx="22" fill="#140E0A"/>
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="url(#markGold)" stroke-width="1.5" stroke-opacity="0.7"/>
  
  <!-- Outer decorative ring -->
  <circle cx="50" cy="50" r="41" stroke="url(#markGold)" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  <circle cx="50" cy="50" r="37" stroke="url(#markGold)" stroke-width="1.2"/>
  
  <!-- Cloche base / Handi bowl -->
  <path d="M 28 65 C 36 76, 64 76, 72 65 Z" fill="url(#markGold)"/>
  <line x1="24" y1="64" x2="76" y2="64" stroke="url(#markGold)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Stylized Royal D / Dome Arch -->
  <path d="M 39 63 V 37 C 39 31, 44 27, 50 27 C 57 27, 62 31, 62 37 C 62 47, 56 55, 39 59" 
        stroke="url(#markGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        
  <!-- Sacred Flame / Diya Core -->
  <path d="M 50 29 C 45 39, 55 43, 50 53 C 45 43, 55 39, 50 29 Z" 
        fill="url(#markFlame)"/>
        
  <!-- Pure Veg Emerald Dot -->
  <circle cx="50" cy="18" r="3.5" fill="#22C55E" stroke="#15803D" stroke-width="0.8"/>
</svg>
