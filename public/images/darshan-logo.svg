<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="accentFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem Mark Container -->
  <g transform="translate(15, 12)">
    <!-- Outer Decorative Arch / Thali Medallion -->
    <circle cx="52" cy="52" r="50" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 2" opacity="0.6"/>
    <circle cx="52" cy="52" r="45" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="52" cy="52" r="40" fill="#1C140E" stroke="url(#goldGrad)" stroke-width="0.8"/>
    
    <!-- Indian Serving Cloche / Royal Arch & Flame -->
    <!-- Cloche Base / Handi Dish Rim -->
    <path d="M 28 66 C 36 78, 68 78, 76 66 Z" fill="url(#goldGrad)"/>
    <line x1="24" y1="65" x2="80" y2="65" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Royal Dome / Arch Lines forming an elegant 'D' Monogram & Flame Motif -->
    <path d="M 40 64 V 38 C 40 32, 45 28, 52 28 C 59 28, 64 32, 64 38 C 64 48, 58 56, 40 60" 
          stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Inner Rising Spice Flame / Diya Light -->
    <path d="M 52 30 C 47 40, 57 44, 52 54 C 47 44, 57 40, 52 30 Z" 
          fill="url(#accentFlame)" filter="url(#subtleGlow)"/>
          
    <!-- Small Pure Veg Jewel Dot at Top -->
    <circle cx="52" cy="18" r="3.5" fill="#22C55E" stroke="#15803D" stroke-width="0.8"/>
    <polygon points="52,10 54,14 58,14 55,17 56,21 52,18 48,21 49,17 46,14 50,14" fill="url(#goldGrad)" transform="translate(0,-2) scale(0.6) translate(35, -4)"/>
  </g>

  <!-- Brand Typography -->
  <!-- Main Title: DARSHAN INN -->
  <text x="135" y="60" 
        font-family="'Playfair Display', 'Cinzel', Georgia, 'Times New Roman', serif" 
        font-size="38" 
        font-weight="700" 
        letter-spacing="4" 
        fill="url(#goldGrad)">
    DARSHAN INN
  </text>
  
  <!-- Subtle Gujarati & Category Subtitle -->
  <text x="138" y="86" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="11.5" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#E2D9CE">
    RESTAURANT &amp; BANQUET
  </text>
  
  <!-- Location & Pure Veg Tagline -->
  <g transform="translate(138, 97)">
    <text x="0" y="11" 
          font-family="'Inter', sans-serif" 
          font-size="9.5" 
          font-weight="500" 
          letter-spacing="2" 
          fill="#A8A29E">
      SURAT · PURE VEGETARIAN · SINCE EST.
    </text>
    <!-- Veg square dot icon -->
    <rect x="300" y="2" width="9" height="9" fill="none" stroke="#22C55E" stroke-width="1.2"/>
    <circle cx="304.5" cy="6.5" r="2.5" fill="#22C55E"/>
  </g>
</svg>
